version: 2

updates:
  # Each action is pinned to a commit. Dependabot moves the commit and the version comment
  # together. Composer is not here: the lock serves only the tests, and the `newest` job takes
  # the new versions on each run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
