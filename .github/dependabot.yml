version: 2

# Each update waits 14 days after its release, so a broken or taken-over release is found by others
# first. No Composer: the lock serves only the tests, and the `newest` job takes the new versions
# on each run.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  # The images of the jobs in Docker and of the workflows, and the image of the demo. None is under
  # .github: GitHub refuses a pull request of this ecosystem that changes a file there.
  - package-ecosystem: docker
    directories:
      - /demo
      - /docker/actionlint
      - /docker/alpine-8.4
      - /docker/alpine-8.5
      - /docker/composer
      - /docker/debian
      - /docker/deps-debian
      - /docker/deps-ubuntu
      - /docker/zizmor
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ['*']
    # The PHP of each image and the release of each system stay; only their patches are updates.
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: debian
        update-types: [version-update:semver-major]
      - dependency-name: ubuntu
        update-types: [version-update:semver-major, version-update:semver-minor]
